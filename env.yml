name: dct-cryptonets
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.9.20
  - pip=24.2
  - wheel=0.44.0
  - setuptools=75.3.0

  # system / base libs
  - ca-certificates=2024.8.30
  - openssl=3.3.2
  - libgcc-ng
  - libstdcxx-ng
  - libzlib
  - ncurses
  - readline
  - tk
  - xz

  - pip:
      - --extra-index-url https://pypi.zama.ai/gpu
      # Core ML / FHE
      - brevitas==0.10.2
      - concrete-ml==1.9.0
      - concrete-ml-extensions==0.1.9
      - concrete-python==2.10.0

      # PyTorch (CUDA 11.8)
      - torch==2.1.0+cu118
      - torchvision==0.16.0+cu118
      - torchaudio==2.1.0+cu118
      - triton==2.1.0

      # CUDA runtime wheels (pulled automatically but pinned for reproducibility)
      - nvidia-cublas-cu11==11.10.3.66
      - nvidia-cublas-cu12==12.1.3.1
      - nvidia-cuda-cupti-cu12==12.1.105
      - nvidia-cuda-nvrtc-cu11==11.7.99
      - nvidia-cuda-nvrtc-cu12==12.1.105
      - nvidia-cuda-runtime-cu11==11.7.99
      - nvidia-cuda-runtime-cu12==12.1.105
      - nvidia-cudnn-cu11==8.5.0.96
      - nvidia-cudnn-cu12==8.9.2.26
      - nvidia-cufft-cu12==11.0.2.54
      - nvidia-curand-cu12==10.3.2.106
      - nvidia-cusolver-cu12==11.4.5.107
      - nvidia-cusparse-cu12==12.1.0.106
      - nvidia-nccl-cu12==2.20.5
      - nvidia-nvjitlink-cu12==12.6.68
      - nvidia-nvtx-cu12==12.1.105

      # Scientific stack
      - numpy==1.26.4
      - scipy==1.10.1
      - pandas==2.0.3
      - scikit-learn==1.5.0
      - sympy==1.13.3
      - networkx==3.2.1
      - mpmath==1.3.0
      - threadpoolctl==3.5.0

      # ONNX
      - onnx==1.17.0
      - onnxruntime==1.18.0
      - onnxconverter-common==1.13.0
      - onnxmltools==1.11.0
      - onnxoptimizer==0.3.13
      - skl2onnx==1.12
      - skops==0.5.0

      # Vision / plotting
      - opencv-python==4.10.0.84
      - pillow==10.4.0
      - matplotlib==3.9.2
      - seaborn==0.13.2
      - contourpy==1.3.0
      - cycler==0.12.1
      - fonttools==4.54.1
      - kiwisolver==1.4.7
      - pyparsing==3.1.4

      # Utilities
      - tqdm==4.66.5
      - psutil==6.0.0
      - joblib==1.4.2
      - dill==0.3.8
      - filelock==3.16.1
      - packaging==24.1
      - requests==2.32.3
      - urllib3==2.2.3
      - certifi==2024.8.30
      - charset-normalizer==3.3.2
      - idna==3.10
      - humanfriendly==10.0
      - coloredlogs==15.0.1
      - tabulate==0.9.0
      - six==1.16.0
      - typing-extensions==4.15.0
      - tzdata==2024.2
      - zipp==3.20.2
      - z3-solver==4.13.0.0

      # HuggingFace / ML utils
      - huggingface-hub==0.25.1
      - hummingbird-ml==0.4.11
      - skorch==0.11.0
      - xgboost==1.6.2

      # JPEG / DCT
      - PyTurboJPEG==1.7.7
      - jpeg2dct==0.2.4

      # Misc
      - Jinja2==3.1.4
      - MarkupSafe==2.1.5
      - PyYAML==6.0.2
      - python-dateutil==2.9.0.post0
      - pytz==2024.2
      - unfoldNd==0.2.3
